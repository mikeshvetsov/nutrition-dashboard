<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дневник питания и тренировок</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172536;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}h2{font-size:19px;margin:0 0 18px}p{color:#5d6c7e}.pill{background:#e6f3ee;color:#197451;border-radius:30px;padding:9px 14px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:26px 0}.card,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 5px 20px #17253606}.label{color:#65758a;font-size:13px}.value{font-size:29px;font-weight:750;margin:10px 0 5px}.small{color:#708095;font-size:12px}.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{margin-bottom:16px}.bars{display:flex;align-items:end;gap:10px;height:230px;border-bottom:1px solid #cbd5e1;padding:15px 5px 0}.barwrap{flex:1;text-align:center;min-width:0}.bar{background:#418cbd;border-radius:8px 8px 0 0;min-height:3px}.bar.partial{background:#9dbbd0}.barlabel{font-size:11px;color:#66778a;margin-top:8px}.legend{font-size:12px;color:#64748b;margin-top:16px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eef2f6;padding:12px 0;font-size:14px}.row:last-child{border:0}.muted{color:#708095}.empty{padding:24px 0;color:#718096}footer{font-size:12px;color:#748297;margin-top:28px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}}@media(max-width:480px){.grid{gap:9px}.card{padding:14px}.value{font-size:23px}}
</style></head><body><main><header><div><div class="label">ЛИЧНЫЙ ДНЕВНИК</div><h1>Питание и тренировки</h1><p>Калории, БЖУ, активность и самочувствие по дням</p></div><span class="pill">Публичная сводка</span></header><div class="grid" id="cards"></div><div class="sections"><section class="panel"><h2>Калорийность по дням</h2><div class="bars" id="bars"></div><div class="legend">Светлый столбец — незавершённый день</div></section><section class="panel"><h2>БЖУ за последний день</h2><div id="macros"></div><p class="small">Значения ориентировочные</p></section><section class="panel"><h2>Тренировки</h2><div id="sessions"></div></section><section class="panel"><h2>Самочувствие</h2><div id="wellbeing"></div></section></div><footer id="updated"></footer></main><script>
const fmt=(n,d=0)=>Number(n??0).toLocaleString('ru-RU',{maximumFractionDigits:d});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const a=d.days||[],last=a.at(-1),t=last?.totals||{},m=d.measurements?.at(-1),s=d.sessions||[],o=d.observations||[];
document.getElementById('cards').innerHTML=[['Последний день',last?day(last.date):'—',last?.status==='in_progress'?'Учёт продолжается':''],['Калории',last?fmt(t.kcal):'—','ккал'],['Белки',last?fmt(t.protein_g,1):'—','г'],['Вес',m?.weight_kg?fmt(m.weight_kg,1):'—','кг · последнее измерение']].map(x=>'<div class="card"><div class="label">'+esc(x[0])+'</div><div class="value">'+esc(x[1])+'</div><div class="small">'+esc(x[2])+'</div></div>').join('');
let max=Math.max(2500,...a.map(x=>x.totals.kcal));document.getElementById('bars').innerHTML=a.slice(-14).map(x=>'<div class="barwrap"><div class="small">'+fmt(x.totals.kcal)+'</div><div class="bar '+(x.status==='in_progress'?'partial':'')+'" style="height:'+Math.max(2,Math.round(x.totals.kcal/max*175))+'px"></div><div class="barlabel">'+esc(day(x.date))+'</div></div>').join('')||'<div class="empty">Пока нет данных</div>';
document.getElementById('macros').innerHTML=[['Белки',t.protein_g],['Жиры',t.fat_g],['Углеводы',t.carbs_g]].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+fmt(x[1],1)+' г</b></div>').join('');
document.getElementById('sessions').innerHTML=s.length?s.slice(-5).reverse().map(x=>'<div class="row"><span>'+esc(day(x.date))+' · '+esc(x.type||'Тренировка')+'</span><b>'+esc(x.duration_min?x.duration_min+' мин':'—')+'</b></div>').join(''):'<div class="empty">Подтверждённых тренировок с датами пока нет</div>';
document.getElementById('wellbeing').innerHTML=o.length?o.slice(-5).reverse().map(x=>'<div class="row"><span>'+esc(x.context)+'</span><span class="muted">'+esc(x.reported_condition)+'</span></div>').join(''):'<div class="empty">Оценки самочувствия пока не добавлены</div>';
document.getElementById('updated').textContent='Обновление данных: '+(d.generated_at?new Date(d.generated_at).toLocaleString('ru-RU'):'неизвестно')+'. Медицинские анализы и сведения об алкоголе не публикуются.';
}).catch(()=>{document.getElementById('cards').textContent='Данные пока не опубликованы. Проверьте настройки GitHub Pages.'});
</script></body></html>
